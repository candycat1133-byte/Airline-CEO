<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=kingdoms-world.html" />
    <title>Kingdoms World</title>
    <meta
      name="description"
      content="An interactive archive of kingdoms, wars, ruins, legends, and strange civilizations."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0b07;
        --text: #f8ecd2;
        --muted: #d0bd99;
        --gold: #d8a83c;
        --line: rgba(226, 191, 118, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(rgba(255, 235, 181, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 235, 181, 0.025) 1px, transparent 1px),
          radial-gradient(circle at 20% 10%, rgba(138, 203, 84, 0.14), transparent 30rem),
          radial-gradient(circle at 80% 20%, rgba(216, 159, 53, 0.18), transparent 28rem),
          var(--bg);
        background-size:
          34px 34px,
          34px 34px,
          auto,
          auto,
          auto;
      }

      main {
        width: min(620px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(31, 25, 15, 0.84);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 8vw, 72px);
        line-height: 0.95;
      }

      p {
        margin: 0 auto 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border: 1px solid rgba(216, 168, 60, 0.72);
        border-radius: 8px;
        color: #130d05;
        font-weight: 850;
        text-decoration: none;
        background: linear-gradient(135deg, #f0ce74, #b9823f);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kingdoms World</h1>
      <p>Opening the interactive archive of kingdoms, wars, ruins, legends, and strange civilizations.</p>
      <a href="kingdoms-world.html">Enter Kingdoms World</a>
    </main>
  </body>
</html>
